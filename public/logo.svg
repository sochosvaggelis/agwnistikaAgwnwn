<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Solid navy from r=270, so the rounded corners match the flat fill of full-bleed icons -->
    <radialGradient id="bg" cx="256" cy="220" r="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b4fb8"/>
      <stop offset="0.6" stop-color="#16296a"/>
      <stop offset="1" stop-color="#0b1533"/>
    </radialGradient>
    <radialGradient id="ball" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffbd7a"/>
      <stop offset="0.45" stop-color="#f97316"/>
      <stop offset="1" stop-color="#b93d0a"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e2ff"/>
    </linearGradient>
    <clipPath id="ballClip"><circle cx="0" cy="0" r="146"/></clipPath>
    <!-- Cut the bars (plus a gap) out of the ball so they read as separate shapes -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="272" y="300" width="58" height="96" rx="18" fill="#000"/>
      <rect x="318" y="254" width="58" height="142" rx="18" fill="#000"/>
      <rect x="364" y="200" width="58" height="196" rx="18" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- Centered and kept inside the 80% safe zone of maskable icons -->
  <g transform="translate(256 256) scale(0.92) translate(-248 -236)">
  <g mask="url(#cut)">
    <g transform="translate(232 228) rotate(-18)">
      <circle r="146" fill="url(#ball)"/>
      <g clip-path="url(#ballClip)" fill="none" stroke="#3a1a08" stroke-width="10" stroke-linecap="round">
        <path d="M0 -146 C 34 -60 34 60 0 146"/>
        <path d="M-146 0 C -60 28 60 28 146 0"/>
        <path d="M-108 -98 C -36 -46 -36 46 -108 98"/>
        <path d="M108 -98 C 36 -46 36 46 108 98"/>
      </g>
      <ellipse cx="-58" cy="-74" rx="52" ry="26" transform="rotate(-32 -58 -74)" fill="#fff" opacity="0.2"/>
    </g>
  </g>
  <rect x="284" y="312" width="34" height="72" rx="9" fill="url(#bar)"/>
  <rect x="330" y="266" width="34" height="118" rx="9" fill="url(#bar)"/>
  <rect x="376" y="212" width="34" height="172" rx="9" fill="url(#bar)"/>
  </g>
</svg>
